name: Check Smart Route static files
on:
  push:
    branches: [main, feature/npk-smart-safety-2026, fix/pedestrian-path-preference-2026, feature/chat-first-route-planning-2026, feature/osm-street-evidence-2026, feature/daily-quests-routecoin-2026, feature/daily-routes-instead-of-daily-tasks-2026, fix/chat-questions-negations-and-time-2026, fix/daily-route-full-card-click-2026, feature/large-click-targets-throughout-app-2026, feature/live-weather-background-2026, feature/adaptive-desktop-mobile-orientation-2026]
  pull_request:
    branches: [main]
jobs:
  static-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML inline JavaScript and external scripts
        run: |
          node --check yakutsk-weather.js
          node tests/yakutsk-weather.test.cjs
          node --check smart-safety.js
          node --check weather-background.js
          node tests/weather-background.test.cjs
          node --check responsive-layout.js
          node tests/responsive-layout.test.cjs
          node tests/navigation-layout.test.cjs
          node tests/simple-home.test.cjs
          node --check route-navigation.js
          node tests/route-navigation.test.cjs
          node --check graphite-theme.js
          node tests/graphite-theme.test.cjs
          node --check dijkstra-lab.js
          node tests/dijkstra-lab.test.cjs
          node --check walking-dijkstra.js
          node tests/walking-dijkstra.test.cjs
          node --check route-ai.js
          node tests/route-ai.test.cjs
          node tests/fast-route-building.test.cjs
          node tests/mobile-real-route.test.cjs
          node --check map-fallback.js
          node --check smart-route-chat.js
          node tests/chat-intent.test.cjs
          node tests/chat-ui-regression.test.cjs
          node --check developer-diagnostics.js
          node tests/developer-diagnostics.test.cjs
          node --check street-audit.js
          node tests/street-audit.test.cjs
          node --check daily-quests.js
          node tests/daily-quests.test.cjs
          node tests/daily-route-card.test.cjs
          node --check tap-targets.js
          node tests/tap-targets.test.cjs
          node --check sw.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          blocks.forEach((x,i)=>{new Function(x[1]);console.log('inline',i,'OK')});
          for(const name of ['smart-safety.js','yakutsk-weather.js','smart-safety.css','weather-background.js','weather-background.css','responsive-layout.js','responsive-layout.css','dijkstra-lab.js','walking-dijkstra.js','route-ai.js','mobile-ux.css','data/yakutsk-center-walking.json','interface-interactions.css','graphite-theme.css','graphite-theme.js','simple-home.css','route-navigation.js','route-navigation.css','map-fallback.js','smart-route-chat.js','smart-route-chat.css','street-audit.js','street-audit.css','daily-quests.js','daily-quests.css','sw.js','manifest.webmanifest','icons/smart-route.svg','icons/smart-route-maskable.svg','icons/favicon.svg','icons/mascot-marshik.svg','developer-diagnostics.js','developer-diagnostics.css','tap-targets.js','tap-targets.css']){
            if(!fs.existsSync(name))throw new Error('Missing file '+name);
          }
          if(!html.includes('yakutsk-weather.js?v=1.0')||!html.includes('smart-safety.js?v=1.2'))throw new Error('Independent auto-weather module missing');
          if(!html.includes('smart-safety.js') || !html.includes('map-fallback.js'))throw new Error('Missing integrations');
          if(!html.includes('weather-background.js?v=1.0')||!html.includes('weather-background.css?v=1.0'))throw new Error('Animated weather background not loaded');
          if(!html.includes('mobile-ux.css?v=1.0')||!html.includes('walking-dijkstra.js?v=2.1'))throw new Error('Mobile layout or real OSM dataset integration missing');
          if(!html.includes('responsive-layout.js?v=1.0')||!html.includes('responsive-layout.css?v=1.0'))throw new Error('Responsive desktop and phone assets missing');
          if(html.includes('user-scalable=no'))throw new Error('Viewport must allow zoom for accessibility');
          if(!html.includes('window.__rrResizeMaps'))throw new Error('Yandex map resize hook missing');
          const fallbackCode=fs.readFileSync('map-fallback.js','utf8');
          if(!fallbackCode.includes('window.__rrResizeFallbackMaps'))throw new Error('Leaflet map resize hook missing');
          const responsiveCss=fs.readFileSync('responsive-layout.css','utf8');
          for(const token of ['@media (min-width:900px)','@media (max-width:599px)','orientation:landscape','grid-template-columns:repeat(4','max-width:none!important']){
            if(!responsiveCss.includes(token))throw new Error('Responsive breakpoint missing: '+token);
          }
          const safetyCode=fs.readFileSync('smart-safety.js','utf8');
          if(!safetyCode.includes('weather_code,is_day')||!safetyCode.includes('RRWeatherBackground.setConditions'))throw new Error('Weather visual state disconnected from real forecast');
          if(!html.includes('demoYakutskBtn'))throw new Error('No preview mode');
          if(html.includes('id="smartChatForm"') || html.includes('id="smartRouteChatForm"'))throw new Error('Chat should not appear in the simple interface');
          if(!html.includes('street-audit.js') || !html.includes('street-audit.css'))throw new Error('OSM audit missing');
          if(!html.includes('daily-quests.js') || !html.includes('daily-quests.css'))throw new Error('Daily quests UI missing');
          if(!html.includes('dailyOfferId:rr.dailyOfferId||null'))throw new Error('Daily route ID missing from verified completion event');
          if(!html.includes('window.__buildDailyRoute'))throw new Error('Daily route generator binding missing');
          if(!html.includes('daily-quests.js?v=2.1'))throw new Error('New daily route card version missing');
          const dailyJS=fs.readFileSync('daily-quests.js','utf8');
          if(!dailyJS.includes('doc.createElement("button");item.type="button"') || !dailyJS.includes('item.addEventListener("click"'))throw new Error('Daily card must be one clickable button');
          if(dailyJS.includes('action.addEventListener("click"'))throw new Error('Old reward-only click target still exists');
          if(!html.includes('icons/mascot-marshik.svg'))throw new Error('Mascot missing from home page');
          if(!html.includes('tap-targets.js?v=1.0')||!html.includes('tap-targets.css?v=1.0'))throw new Error('App-wide tap-area enhancement missing');
          const tapCode=fs.readFileSync('tap-targets.js','utf8');
          if(!tapCode.includes('controls.length!==1'))throw new Error('Unsafe card multi-action guard missing');
          if(!html.includes('developerDiagnostics')||!html.includes('window.__rrDeveloperCatalog')||!html.includes('window.__rrDeveloperRouteProbe'))throw new Error('Developer diagnostics hooks missing');
          if(!html.includes('simple-home.css?v=1.0')||!html.includes('route-navigation.css?v=1.0'))throw new Error('Simple interface and navigation styles missing');
          if(!html.includes('icons/favicon.svg?v=4'))throw new Error('Optimized favicon link missing');
          if(!html.includes('id="rrHomeWeatherValue"') || !html.includes('id="homeOpenCreateBtn"') || !html.includes('id="rrNavPanel"'))throw new Error('Simple home or GPS navigation missing');
          if(!html.includes('RRWalkingDijkstra.requestRoute')||!html.includes('RRRouteAI?.score'))throw new Error('Dijkstra/learned route selection missing');
          if(/valhalla/i.test(html))throw new Error('Only Dijkstra can calculate routes');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(!manifest.icons.find(x=>x.purpose==='maskable'))throw new Error('Maskable PWA icon missing');
          for(const p of ['icons/smart-route.svg','icons/smart-route-maskable.svg','icons/favicon.svg','icons/mascot-marshik.svg']){
            const txt=fs.readFileSync(p,'utf8');
            if(!txt.includes('<svg')||!txt.includes('</svg>'))throw new Error('SVG icon malformed: '+p);
          }
          console.log('Static checks passed');
          NODE
      - name: Verify a real Yakutsk walking loop from saved OSM data
        run: node tests/live-osm-smoke.test.cjs
      - name: Test mobile screen and full Dijkstra route in headless Chromium
        timeout-minutes: 5
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rr-mobile-test-server.log 2>&1 &
          node tests/mobile-browser-smoke.cjs
